name: Build CI/CD

on:
  push:
    branches:
      - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Go
            uses: actions/setup-go@v5
            with:
              go-version: '1.22'

          - name: Install dependencies
            run: go mod download

          - name: Run tests
            run: go test ./main_test.go
    compile:
        runs-on: ubuntu-latest
        needs: test
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Set up Go
            uses: actions/setup-go@v5
            with:
              go-version: '1.22'

          - name: Install dependencies
            run: go mod download

          - name: Compile binary
            run: go build -o myapp
    build:
        runs-on: ubuntu-latest
        permission:
            contents: write
            packages: write
        needs: compile
        if: success()

        steps:
           - name: Checkout code
             uses: actions/checkout@v4

           - name: Set up Go
             uses: actions/setup-go@v5
             with:
                 go-version: '1.22'
           - name: Log in to GHCR
             uses: docker/login-action@v3
             with:
                 registry: ghcr.io
                 username: ${{  pasca23  }}
                 password: ${{  secrets.GITHUB_TOKEN  }}
           - name: Build Docker Image
             run: docker build -t ghcr.io/pasca23/ci_cd_lab:latest
